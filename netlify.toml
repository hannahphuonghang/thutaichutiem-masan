[build]
publish = "."
functions = "netlify/functions"

[functions]

  [functions."*"]

[[headers]]
for = "/*"

  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
from = "/api"
to = "/.netlify/functions/api"
status = 200
force = false
